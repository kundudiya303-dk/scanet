version: "3.9"

services:
  scanet:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: scanet-app
    ports:
      - "8000:8000"
    volumes:
      # Persist database
      - scanet-data:/scanet/backend/data
      # Mount wordlists
      - ../wordlists:/scanet/wordlists:ro
    environment:
      - DEBUG=false
      - HOST=0.0.0.0
      - PORT=8000
      - MAX_CONCURRENT_JOBS=2
      - DEFAULT_JOB_TIMEOUT=600
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/system/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  scanet-data:
    driver: local
