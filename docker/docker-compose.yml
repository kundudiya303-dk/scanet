services:
  scanet:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "${SCANET_PORT:-8000}:${PORT:-8000}"
    volumes:
      # Persist database
      - scanet-data:/scanet/backend/data
      # Mount wordlists
      - ../wordlists:/scanet/wordlists:ro
    environment:
      DEBUG: "false"
      HOST: 0.0.0.0
      PORT: ${PORT:-8000}
      MAX_CONCURRENT_JOBS: 2
      DEFAULT_JOB_TIMEOUT: 600
      PYTHONUNBUFFERED: 1
      PYTHONDONTWRITEBYTECODE: 1
    init: true
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:$${PORT:-8000}/api/v1/system/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    stop_grace_period: 30s

volumes:
  scanet-data:
    driver: local
