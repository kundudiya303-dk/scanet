<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none" width="100%" height="100%">
  <defs>
    <!-- Neon Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur1" />
      <feGaussianBlur stdDeviation="6" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Gradients -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5d4" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <linearGradient id="innerShieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#030712" stop-opacity="0.95" />
    </linearGradient>

    <linearGradient id="radarSweep" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5d4" stop-opacity="0.8" />
      <stop offset="60%" stop-color="#6366f1" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0" />
    </linearGradient>

    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f5d4" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#00f5d4" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Outer Shield Aura -->
  <path d="M100 12 L170 36 C170 102 142 158 100 188 C58 158 30 102 30 36 Z" 
        stroke="url(#shieldGrad)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"
        fill="url(#innerShieldGrad)" filter="url(#neonGlow)" />

  <!-- Inner Shield Trim Line -->
  <path d="M100 24 L158 44 C158 98 135 146 100 172 C65 146 42 98 42 44 Z" 
        stroke="#6366f1" stroke-width="1.5" stroke-dasharray="4 2" stroke-opacity="0.6" fill="none" />

  <!-- Center Radar Glow -->
  <circle cx="100" cy="98" r="46" fill="url(#centerGlow)" />

  <!-- Concentric Radar Rings -->
  <circle cx="100" cy="98" r="44" stroke="#06b6d4" stroke-width="1.5" stroke-opacity="0.5" fill="none" />
  <circle cx="100" cy="98" r="30" stroke="#00f5d4" stroke-width="1.2" stroke-opacity="0.6" fill="none" />
  <circle cx="100" cy="98" r="16" stroke="#a855f7" stroke-width="1" stroke-opacity="0.7" fill="none" />
  <circle cx="100" cy="98" r="3" fill="#00f5d4" filter="url(#neonGlow)" />

  <!-- Radar Crosshairs Reticle -->
  <line x1="100" y1="50" x2="100" y2="146" stroke="#00f5d4" stroke-width="1.2" stroke-opacity="0.7" />
  <line x1="52" y1="98" x2="148" y2="98" stroke="#00f5d4" stroke-width="1.2" stroke-opacity="0.7" />

  <!-- Polar Hash Marks -->
  <line x1="100" y1="52" x2="100" y2="58" stroke="#ffffff" stroke-width="1.5" />
  <line x1="100" y1="138" x2="100" y2="144" stroke="#ffffff" stroke-width="1.5" />
  <line x1="54" y1="98" x2="60" y2="98" stroke="#ffffff" stroke-width="1.5" />
  <line x1="140" y1="98" x2="146" y2="98" stroke="#ffffff" stroke-width="1.5" />

  <!-- Hexagonal / Constellation Network Nodes -->
  <g stroke="#6366f1" stroke-width="1" stroke-opacity="0.5">
    <line x1="72" y1="76" x2="100" y2="62" />
    <line x1="100" y1="62" x2="128" y2="76" />
    <line x1="128" y1="76" x2="132" y2="114" />
    <line x1="132" y1="114" x2="100" y2="134" />
    <line x1="100" y1="134" x2="68" y2="114" />
    <line x1="68" y1="114" x2="72" y2="76" />
    
    <line x1="100" y1="98" x2="72" y2="76" />
    <line x1="100" y1="98" x2="128" y2="76" />
    <line x1="100" y1="98" x2="100" y2="134" />
  </g>

  <!-- Node Dots -->
  <circle cx="72" cy="76" r="2.5" fill="#00f5d4" />
  <circle cx="100" cy="62" r="3" fill="#38bdf8" />
  <circle cx="128" cy="76" r="2.5" fill="#a855f7" />
  <circle cx="132" cy="114" r="2.5" fill="#f43f5e" />
  <circle cx="100" cy="134" r="3" fill="#00f5d4" />
  <circle cx="68" cy="114" r="2.5" fill="#818cf8" />

  <!-- Dynamic Radar Sweep Line -->
  <path d="M100 98 L138 64 A44 44 0 0 0 100 54 Z" fill="url(#radarSweep)">
    <animateTransform attributeName="transform" type="rotate" from="0 100 98" to="360 100 98" dur="4s" repeatCount="indefinite" />
  </path>
</svg>
